name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Check code
        run: uv run --frozen ruff check .

      - name: Run tests
        run: uv run --frozen pytest

      - name: Rebuild checked-in ONS snapshot
        run: uv run --frozen uk-tech build

      - name: Rebuild modelling outputs from checked-in foreign snapshots
        run: uv run --frozen uk-tech model
