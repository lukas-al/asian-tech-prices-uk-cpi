[project]
name = "uk-tech-prices"
version = "0.1.0"
description = "Reproducible analysis of Asian technology prices and UK CPI technology-goods inflation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<3",
    "python-calamine>=0.4,<1",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
    "statsmodels>=0.14,<1",
    "truststore>=0.10,<1",
]

[project.scripts]
uk-tech = "uk_tech_prices.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_tech_prices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

